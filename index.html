  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

vw,48px);font-weight:800;font-size:clamp(28px,4vw,50px);line-height:1.08;letter-spacing:-.02em\">Za tebe je ako si:<\u002Fh2>\n    <div data-reveal=\"\" data-reveal-delay=\"80\" style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:clamp(32px,4vw,44px)\">\n      <span style=\"background:var(--tintblue);border:1px solid var(--line);border-radius:14px;padding:16px 30px;font-weight:800;font-size:clamp(16px,1.6vw,20px);color:var(--blue)\">FIZIOTERAPEUT<\u002Fspan>\n      <span style=\"background:var(--tintblue);border:1px solid var(--line);border-radius:14px;padding:16px 30px;font-weight:800;font-size:clamp(16px,1.6vw,20px);color:var(--blue)\">TRENER<\u002Fspan>\n      <span style=\"background:var(--tintblue);border:1px solid var(--line);border-radius:14px;padding:16px 30px;font-weight:800;font-size:clamp(16px,1.6vw,20px);color:var(--blue)\">FIZIJATAR<\u002Fspan>\n    <\u002Fdiv>\n    <p data-reveal=\"\" data-reveal-delay=\"140\" style=\"margin:0 auto 10px;max-width:560px;font-size:clamp(17px,1.6vw,21px);font-weight:600;line-height:1.5\">…i radiš sa ljudima koji imaju bol u leđima.<\u002Fp>\n    <p data-reveal=\"\" data-reveal-delay=\"200\" style=\"margin:0 auto;max-width:600px;color:var(--muted);font-size:clamp(15px,1.4vw,18px);line-height:1.5\">Bez obzira da li si na početku karijere ili već godinama radiš sa pacijentima.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SEKCIJA 2 — PROBLEM -->\n<section id=\"problem\" style=\"scroll-margin-top:80px;background:var(--tintblue);padding:clamp(40px,5vw,72px) 24px clamp(40px,5vw,64px)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <div data-reveal=\"\" style=\"display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;margin-bottom:26px\"><span style=\"width:28px;height:2px;background:var(--cyan);flex:0 0 auto;border-radius:2px\"><\u002Fspan>Problem<\u002Fdiv>\n    <div data-reveal=\"\" data-reveal-delay=\"60\" style=\"display:none\">\n      <span>Već znaš anatomiju.<\u002Fspan>\n      <span style=\"width:4px;height:4px;border-radius:50%;background:var(--green);flex:0 0 auto\"><\u002Fspan>\n      <span>Već znaš vežbe.<\u002Fspan>\n      <span style=\"width:4px;height:4px;border-radius:50%;background:var(--green);flex:0 0 auto\"><\u002Fspan>\n      <span>Već znaš tehnike.<\u002Fspan>\n    <\u002Fdiv>\n    <p data-reveal=\"\" data-reveal-delay=\"120\" style=\"margin: 0 0 clamp(36px,4.5vw,56px); font-size: clamp(24px,3.4vw,40px); font-weight: 800; color: var(--ink); line-height: 1.14; letter-spacing: -.02em; max-width: 860px\">\n      Većina terapeuta ima dovoljno tehnika.<br><span style=\"color:var(--blue)\">Ono što im nedostaje jeste sistem.<\u002Fspan>\n    <\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden\">\n      <div data-reveal=\"\" style=\"background:#fff;padding:clamp(26px,3vw,36px);display:flex;gap:18px;align-items:flex-start\"><span style=\"flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:rgba(128,195,71,.14);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:15px\">01<\u002Fspan><p style=\"margin:0;font-size:clamp(16px,1.4vw,19px);font-weight:600;line-height:1.45\">Znaš mnogo tehnika&nbsp;&nbsp;<span style=\"color: var(--gray); font-weight: 500;\">ali ne znaš koju da izabereš.<\u002Fspan><\u002Fp><\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"80\" style=\"background:#fff;padding:clamp(26px,3vw,36px);display:flex;gap:18px;align-items:flex-start\"><span style=\"flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:rgba(128,195,71,.14);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:15px\">02<\u002Fspan><p style=\"margin:0;font-size:clamp(16px,1.4vw,19px);font-weight:600;line-height:1.45\">Radiš po dijagnozi&nbsp;<span style=\"color: var(--gray); font-weight: 500;\">ali isti pristup ne radi kod svakog pacijenta.<\u002Fspan><\u002Fp><\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"160\" style=\"background:#fff;padding:clamp(26px,3vw,36px);display:flex;gap:18px;align-items:flex-start;border-top:1px solid var(--line)\"><span style=\"flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:rgba(128,195,71,.14);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:15px\">03<\u002Fspan><p style=\"margin:0;font-size:clamp(16px,1.4vw,19px);font-weight:600;line-height:1.45\">Ne znaš kada da promeniš fazu&nbsp; <span style=\"font-weight: normal;\">zato<\u002Fspan>&nbsp;<span style=\"color: var(--gray); font-weight: 500;\">&nbsp;se oslanjaš na osećaj.<\u002Fspan><\u002Fp><\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"240\" style=\"background:#fff;padding:clamp(26px,3vw,36px);display:flex;gap:18px;align-items:flex-start;border-top:1px solid var(--line)\"><span style=\"flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:rgba(128,195,71,.14);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:15px\">04<\u002Fspan><p style=\"margin:0;font-size:clamp(16px,1.4vw,19px);font-weight:600;line-height:1.45\">Pacijentu bude bolje&nbsp;&nbsp;<span style=\"color: var(--gray); font-weight: 500;\">ali se vraća sa istim problemom.<\u002Fspan><\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SEKCIJA 3 — PREOKRET -->\n<section style=\"background:#fff;padding:clamp(48px,6vw,80px) 24px\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <div data-reveal=\"\" style=\"display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;margin-bottom:clamp(24px,3vw,34px)\"><span style=\"width:28px;height:2px;background:var(--cyan);flex:0 0 auto;border-radius:2px\"><\u002Fspan>Po čemu se razlikujemo<\u002Fdiv>\n    <h2 data-reveal=\"\" data-reveal-delay=\"60\" style=\"margin:0 0 clamp(28px,3.5vw,40px);font-weight:800;font-size:clamp(24px,3.4vw,42px);line-height:1.12;letter-spacing:-.02em;max-width:920px;color:#111\">Većina kurseva prodaje tehnike.<br><span style=\"color:var(--blue)\">Ovaj kurs prodaje način razmišljanja.<\u002Fspan><\u002Fh2>\n    <div style=\"max-width:1120px;margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:{{ diffCols }};align-items:stretch;gap:clamp(20px,3vw,32px)\">\n      <div data-reveal=\"\" style=\"padding:clamp(28px,3.5vw,44px);display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--line);border-radius:22px\">\n        <div style=\"font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--gray);text-transform:uppercase\">Većina edukacija<\u002Fdiv>\n        <div style=\"font-weight:800;font-size:clamp(22px,2.6vw,30px);line-height:1.1;color:var(--gray)\">Uči te tehnike<\u002Fdiv>\n        <ul style=\"margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n          <li style=\"display:flex;gap:11px;align-items:flex-start;color:var(--muted);font-size:14px;line-height:1.45\"><span style=\"width:8px;height:8px;border:1.5px solid var(--gray);border-radius:50%;flex:0 0 auto;margin-top:5px\"><\u002Fspan>Terapija počinje od tehnike koju terapeut najbolje zna<\u002Fli>\n          <li style=\"display:flex;gap:11px;align-items:flex-start;color:var(--muted);font-size:14px;line-height:1.45\"><span style=\"width:8px;height:8px;border:1.5px solid var(--gray);border-radius:50%;flex:0 0 auto;margin-top:5px\"><\u002Fspan>Rezultat zavisi od toga koliko je pogodak bio srećan<\u002Fli>\n          <li style=\"display:flex;gap:11px;align-items:flex-start;color:var(--muted);font-size:14px;line-height:1.45\"><span style=\"width:8px;height:8px;border:1.5px solid var(--gray);border-radius:50%;flex:0 0 auto;margin-top:5px\"><\u002Fspan>Kada tehnika ne radi, nema sledećeg koraka<\u002Fli>\n          <li style=\"display:flex;gap:11px;align-items:flex-start;color:var(--muted);font-size:14px;line-height:1.45\"><span style=\"width:8px;height:8px;border:1.5px solid var(--gray);border-radius:50%;flex:0 0 auto;margin-top:5px\"><\u002Fspan>Svaki novi kurs dodaje alat, ali ne i kriterijum<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"120\" style=\"padding:clamp(28px,3.5vw,44px);display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#0e2033 0%,#0c1c2d 100%);color:#fff;border-radius:22px;box-shadow:0 26px 60px rgba(12,28,45,.3)\">\n        <div style=\"font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--green);text-transform:uppercase\">Ovo je drugačije<\u002Fdiv>\n        <div style=\"font-weight:800;font-size:clamp(22px,2.6vw,30px);line-height:1.1\">Uči <span style=\"color:var(--green)\">te sistem odlučivanja<\u002Fspan><\u002Fdiv>\n        <ul style=\"margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n          <li style=\"display:flex;gap:11px;align-items:flex-start;color:rgba(255,255,255,.82);font-size:14px;line-height:1.45\"><span style=\"width:8px;height:8px;background:var(--green);border-radius:50%;flex:0 0 auto;margin-top:5px\"><\u002Fspan>Terapija počinje od nalaza, ne od omiljene tehnike<\u002Fli>\n          <li style=\"display:flex;gap:11px;align-items:flex-start;color:rgba(255,255,255,.82);font-size:14px;line-height:1.45\"><span style=\"width:8px;height:8px;background:var(--green);border-radius:50%;flex:0 0 auto;margin-top:5px\"><\u002Fspan>Svaki izbor ima razlog koji možeš da obrazložiš<\u002Fli>\n          <li style=\"display:flex;gap:11px;align-items:flex-start;color:rgba(255,255,255,.82);font-size:14px;line-height:1.45\"><span style=\"width:8px;height:8px;background:var(--green);border-radius:50%;flex:0 0 auto;margin-top:5px\"><\u002Fspan>Kada nešto ne radi, sistem pokazuje gde da se vratiš<\u002Fli>\n          <li style=\"display:flex;gap:11px;align-items:flex-start;color:rgba(255,255,255,.82);font-size:14px;line-height:1.45\"><span style=\"width:8px;height:8px;background:var(--green);border-radius:50%;flex:0 0 auto;margin-top:5px\"><\u002Fspan>Nove tehnike se uklapaju u strukturu koju već imaš<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-reveal=\"\" style=\"margin: clamp(28px,3.5vw,40px) auto 0; max-width: 680px; text-align: center; font-weight: 600; font-size: clamp(17px,1.7vw,21px); line-height: 1.5; color: var(--gray)\">Nije poenta da znaš više tehnika.&nbsp;<span style=\"color: var(--ink); font-weight: 800;\">Poenta je da znaš koju da primeniš, i zašto.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SEKCIJA 5 — ŠTA SE MENJA -->\n<section style=\"background:var(--tintblue);padding:clamp(44px,5vw,72px) 24px\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <div data-reveal=\"\" style=\"display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;margin-bottom:clamp(20px,2.5vw,28px)\" data-comment-anchor=\"06ec26c141-div\"><span style=\"width:28px;height:2px;background:var(--cyan);flex:0 0 auto;border-radius:2px\"><\u002Fspan>Šta se menja<\u002Fdiv>\n    <h2 data-reveal=\"\" data-reveal-delay=\"60\" style=\"margin:0 0 clamp(28px,3.5vw,40px);font-weight:800;font-size:clamp(24px,3.4vw,42px);line-height:1.12;letter-spacing:-.02em;max-width:920px;color:#111\">Od prve procene<br><span style=\"color:var(--blue)\">do povratka punom opterećenju.<\u002Fspan><\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(20px,3vw,32px)\">\n      <div data-reveal=\"\" style=\"background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(28px,3.5vw,42px)\">\n        <div style=\"font-weight:800;font-size:18px;color:var(--gray);margin-bottom:22px;letter-spacing:.04em\">PRE<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start;color:var(--gray);font-weight:500\"><span style=\"color:#c2515a;font-weight:800;flex:0 0 auto\">✕<\u002Fspan>Improvizuješ redosled.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;color:var(--gray);font-weight:500\"><span style=\"color:#c2515a;font-weight:800;flex:0 0 auto\">✕<\u002Fspan>Oslanjaš se na osećaj.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;color:var(--gray);font-weight:500\"><span style=\"color:#c2515a;font-weight:800;flex:0 0 auto\">✕<\u002Fspan>Nisi siguran kada da promeniš fazu.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;color:var(--gray);font-weight:500\"><span style=\"color:#c2515a;font-weight:800;flex:0 0 auto\">✕<\u002Fspan>Teško objašnjavaš pacijentu šta radiš.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;color:var(--gray);font-weight:500\"><span style=\"color:#c2515a;font-weight:800;flex:0 0 auto\">✕<\u002Fspan>Ne znaš šta dalje kada napredak stane.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"120\" style=\"background:linear-gradient(180deg,#0e2033 0%,#0c1c2d 100%);border-radius:20px;padding:clamp(28px,3.5vw,42px);color:#fff;box-shadow:0 26px 60px rgba(12,28,45,.3)\">\n        <div style=\"font-weight:800;font-size:18px;color:var(--green);margin-bottom:22px;letter-spacing:.04em\">POSLE<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start;font-weight:700\"><span style=\"color:var(--green);font-weight:800;flex:0 0 auto\">✓<\u002Fspan>Proceniš.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;font-weight:700\"><span style=\"color:var(--green);font-weight:800;flex:0 0 auto\">✓<\u002Fspan>Razumeš nalaz.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;font-weight:700\"><span style=\"color:var(--green);font-weight:800;flex:0 0 auto\">✓<\u002Fspan>Doneseš odluku.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;font-weight:700\"><span style=\"color:var(--green);font-weight:800;flex:0 0 auto\">✓<\u002Fspan>Odrediš progresiju.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;font-weight:700\"><span style=\"color:var(--green);font-weight:800;flex:0 0 auto\">✓<\u002Fspan>Znaš kada je pacijent spreman za sledeći nivo.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SEKCIJA 4 — CENTRALNI KONCEPT -->\n<section style=\"background:linear-gradient(180deg,#0e2033 0%,#0c1c2d 100%);padding:clamp(32px,4vw,56px) 24px clamp(56px,7vw,104px)\">\n  <div style=\"max-width:1120px;margin:0 auto;display:grid;grid-template-columns:{{ konceptCols }};gap:clamp(32px,5vw,64px);align-items:start\">\n    <div style=\"padding-top:clamp(10px,2vw,28px)\">\n      \n      <div data-reveal=\"\" style=\"display:inline-flex;align-items:center;gap:12px;font-weight:800;font-size:13px;letter-spacing:.14em;color:#7fb2d6;text-transform:uppercase;margin-bottom:38px\"><span style=\"width:28px;height:2px;background:#7fb2d6;flex:0 0 auto;border-radius:2px\"><\u002Fspan>Sistem koji dobijaš<\u002Fdiv><h2 data-reveal=\"\" data-reveal-delay=\"40\" style=\"margin: 0 0 20px; font-weight: 800; font-size: clamp(30px,4vw,52px); line-height: 1.04; letter-spacing: -.02em; color:#fff\">\n        Vežba nije rešenje. <span style=\"color:var(--green)\">Vežba je alat.<\u002Fspan>\n      <\u002Fh2>\n      <p data-reveal=\"\" data-reveal-delay=\"80\" style=\"margin:0 0 20px;font-size:clamp(17px,1.7vw,22px);color:rgba(255,255,255,.85);line-height:1.5\">\n        Ne dobijaš recept za pacijenta. Dobijaš sistem kojim biraš pravi alat.\n      <\u002Fp>\n      <p data-reveal=\"\" data-reveal-delay=\"100\" style=\"margin:0 0 24px;padding-left:18px;border-left:3px solid var(--green);font-size:clamp(15px,1.5vw,18px);color:rgba(255,255,255,.68);line-height:1.55\">\n        Svaka odluka proizlazi iz procene, a napredovanje kroz rehabilitaciju određuju <span style=\"color:#fff;font-weight:700\">jasni kriterijumi, ne kalendar.<\u002Fspan>\n      <\u002Fp>\n      <div data-reveal=\"\" data-reveal-delay=\"120\" style=\"margin-top:clamp(10px,2vw,24px);display:inline-flex;align-items:center;gap:12px;background:rgba(128,195,71,.2);border:1px solid rgba(128,195,71,.6);border-radius:14px;padding:14px 20px;font-weight:800;font-size:clamp(15px,1.4vw,18px);color:#fff\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 auto\"><\u002Fspan>Upravo ovo dobijaš na edukaciji.\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"align-self:center;margin-top:clamp(16px,3vw,40px)\">\n      <div data-reveal=\"\" data-reveal-delay=\"120\" style=\"background:#fff;border:1px solid rgba(128,195,71,.45);border-radius:24px;padding:clamp(34px,4vw,56px);box-shadow:0 30px 70px rgba(128,195,71,.2)\">\n        <div style=\"font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--green);text-transform:uppercase;margin-bottom:26px\">Sistem<\u002Fdiv>\n        <div style=\"position:relative;display:flex;flex-direction:column;gap:20px\">\n          <div style=\"position:absolute;left:18px;top:16px;bottom:16px;width:2px;background:linear-gradient(180deg,var(--green),var(--blue));z-index:0\"><\u002Fdiv>\n          <div style=\"position:relative;z-index:1;display:flex;align-items:flex-start;gap:16px\"><span style=\"width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:var(--green);color:#0f2a14;display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:0 0 0 4px #fff;animation:lkglowG 3s ease-in-out infinite;animation-delay:0s\">1<\u002Fspan><div><div style=\"font-weight:800;font-size:clamp(16px,1.6vw,20px);line-height:1.2\">Procena<\u002Fdiv><div style=\"margin-top:4px;color:var(--muted);font-size:14px;line-height:1.45\">Šta pacijent može, šta ne može i šta zahteva dodatnu proveru.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"position:relative;z-index:1;display:flex;align-items:flex-start;gap:16px\"><span style=\"width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:var(--green);color:#0f2a14;display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:0 0 0 4px #fff;animation:lkglowG 3s ease-in-out infinite;animation-delay:.3s\">2<\u002Fspan><div><div style=\"font-weight:800;font-size:clamp(16px,1.6vw,20px);line-height:1.2\">Odluka<\u002Fdiv><div style=\"margin-top:4px;color:var(--muted);font-size:14px;line-height:1.45\">Šta nalaz znači i šta je sledeći pravi korak.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"position:relative;z-index:1;display:flex;align-items:flex-start;gap:16px\"><span style=\"width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:var(--green);color:#0f2a14;display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:0 0 0 4px #fff;animation:lkglowG 3s ease-in-out infinite;animation-delay:.6s\">3<\u002Fspan><div><div style=\"font-weight:800;font-size:clamp(16px,1.6vw,20px);line-height:1.2\">Intervencija<\u002Fdiv><div style=\"margin-top:4px;color:var(--muted);font-size:14px;line-height:1.45\">Prava intervencija, izabrana na osnovu nalaza.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"position:relative;z-index:1;display:flex;align-items:flex-start;gap:16px\"><span style=\"width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:var(--green);color:#0f2a14;display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:0 0 0 4px #fff;animation:lkglowG 3s ease-in-out infinite;animation-delay:.9s\">4<\u002Fspan><div><div style=\"font-weight:800;font-size:clamp(16px,1.6vw,20px);line-height:1.2\">Progresija<\u002Fdiv><div style=\"margin-t ransition = 'opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)';\n        el.style.willChange = 'opacity, transform';\n      });\n      const reveal = (el) => {\n        const d = parseFloat(el.getAttribute('data-reveal-delay') || '0');\n        el.style.transitionDelay = d + 'ms';\n        el.style.opacity = '1';\n        el.style.transform = 'none';\n      };\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach(e => {\n          if (e.isIntersecting) {\n            reveal(e.target);\n            io.unobserve(e.target);\n          }\n        });\n      }, { threshold: 0.08, rootMargin: '0px 0px 0px 0px' });\n      els.forEach(el => io.observe(el));\n      this._io = io;\n      // Safety net: reveal anything sitting in the viewport (covers the\n      // bottom-of-page dead zone where an element can't scroll past the\n      // observer trigger line, and iframe/embedded viewports).\n      this._revealSafety = () => {\n        const vh = window.innerHeight || document.documentElement.clientHeight;\n        els.forEach(el => {\n          if (el.style.opacity === '1') return;\n          const r = el.getBoundingClientRect();\n          if (r.top < vh - 40 && r.bottom > 0) { reveal(el); io.unobserve(el); }\n        });\n      };\n      window.addEventListener('scroll', this._revealSafety, { passive: true });\n      window.addEventListener('resize', this._revealSafety);\n      setTimeout(this._revealSafety, 400);\n    }\n  }\n\n  componentWillUnmount() {\n    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);\n    if (this._revealSafety) { window.removeEventListener('scroll', this._revealSafety); window.removeEventListener('resize', this._revealSafety); }\n    if (this._measure) window.removeEventListener('resize', this._measure);\n    if (this._ro) this._ro.disconnect();\n    if (this._heroTimer) clearInterval(this._heroTimer);\n    if (this._io) this._io.disconnect();\n  }\n\n  toggleDay(d) {\n    this.setState(s => ({ openDay: s.openDay === d ? 0 : d }));\n  }\n\n  goHero(i) {\n    if (this._heroTimer) { clearInterval(this._heroTimer); this._heroTimer = null; }\n    this.setState({ heroSlide: (i + this.heroCount) % this.heroCount });\n  }\n\n  onSubmitForm(e) {\n    e.preventDefault();\n    this.setState({ formSent: true });\n  }\n\n  renderVals() {\n    const d1 = this.state.openDay === 1;\n    const d2 = this.state.openDay === 2;\n    const narrow = this.state.narrow;\n    const menuVisible = narrow && this.state.menuOpen;\n    const hs = this.state.heroSlide;\n    const dotOn = 'var(--green)';\n    const dotOff = 'rgba(255,255,255,.6)';\n    return {\n      s0: hs === 0 ? '1' : '0', s1: hs === 1 ? '1' : '0', s2: hs === 2 ? '1' : '0',\n      z0: hs === 0 ? '2' : '1', z1: hs === 1 ? '2' : '1', z2: hs === 2 ? '2' : '1',\n      pe0: hs === 0 ? 'auto' : 'none', pe1: hs === 1 ? 'auto' : 'none', pe2: hs === 2 ? 'auto' : 'none',\n      dot0: hs === 0 ? dotOn : dotOff, dot1: hs === 1 ? dotOn : dotOff, dot2: hs === 2 ? dotOn : dotOff,\n      dw0: hs === 0 ? '22px' : '9px', dw1: hs === 1 ? '22px' : '9px', dw2: hs === 2 ? '22px' : '9px',\n      heroNext: () => this.goHero(hs + 1),\n      heroPrev: () => this.goHero(hs - 1),\n      heroGo0: () => this.goHero(0), heroGo1: () => this.goHero(1), heroGo2: () => this.goHero(2),\n      formSent: this.state.formSent,\n      formOpen: !this.state.formSent,\n      onSubmitForm: (e) => this.onSubmitForm(e),\n      narrow,\n      wide: !narrow,\n      vsCols: narrow ? '1fr' : '1fr auto 1fr',\n      diffCols: narrow ? '1fr' : '1fr 1fr',\n      heroBtnFlex: narrow ? '1 1 100%' : '0 0 auto',\n      heroCols: narrow ? '1fr' : 'minmax(320px,1fr) auto minmax(320px,1fr)',\n      heroGap: narrow ? '18px' : 'clamp(28px,3.5vw,52px)',\n      praksaCols: narrow ? '1fr' : '1fr 1.15fr',\n      konceptCols: narrow ? '1fr' : '1fr 1fr',\n      dobijasCols: narrow ? '1fr' : 'repeat(3,1fr)',\n      dobijasSpan: narrow ? 'auto' : '1 / -1',\n
